<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TWA JRPG Auto Battle</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f0c;color:#f4ead8;font:14px system-ui,"Noto Sans Thai",sans-serif}.wrap{max-width:1120px;margin:auto;padding:8px}#view{position:relative;height:min(61vh,590px);min-height:370px;border:1px solid #536657;border-radius:14px;overflow:hidden;background:#1b2720}canvas{width:100%!important;height:100%!important;display:block}.combatFx{position:absolute;inset:0;pointer-events:none}.damage{position:absolute;font-weight:1000;font-size:24px;color:#fff2c7;text-shadow:0 2px 2px #000}.teamBrain,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.cards{grid-template-columns:repeat(4,1fr)}.brain,.card,.inspector{border:1px solid #5b604d;border-radius:10px;background:#151a14;padding:8px}.card{cursor:pointer}.card.selected{outline:2px solid #e4bd63}.bar{height:6px;background:#38271e;border-radius:99px;overflow:hidden;margin:4px 0}.hp{height:100%;background:#ca4b42}.muted{color:#b9aa94}.controls{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:8px}button{border:1px solid #6c563d;border-radius:10px;background:#211710;color:#fff;padding:8px;min-height:42px}.on{outline:2px solid #e4bd63}.log{margin-top:8px;padding:8px;border:1px solid #514232;border-radius:10px;background:#15100d}.inspector{margin-top:8px;background:#111712}.insHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.intent{font-size:18px;font-weight:900;color:#f3ca70}.tabs{display:flex;gap:5px;margin:8px 0}.tabs button{flex:1;min-height:34px;padding:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.panel{background:#0b100c;border:1px solid #39483b;border-radius:8px;padding:8px}.candidate{display:grid;grid-template-columns:1fr auto;gap:4px;border-bottom:1px solid #2d382f;padding:6px 0}.candidate:last-child{border:0}.score{font-weight:900;color:#e4bd63}.components{grid-column:1/-1;font-size:11px;color:#a9b5aa}.nav{display:flex;gap:6px;margin-top:8px}.nav button{flex:1}.hidden{display:none}@media(max-width:700px){.controls{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.inspector{position:relative}.teamBrain{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h2 style="margin:4px 0">⚔️ TWA JRPG — Auto Battle 2v2</h2><div class="muted">R6 · Deep Role Brain + AI Inspector</div><div id="view"><div id="combatFx" class="combatFx"></div></div><div class="teamBrain"><div class="brain"><b>🔵 TEAM BLUE</b><span id="blueIntent" class="muted">รอการวางแผน</span></div><div class="brain"><b>🔴 TEAM RED</b><span id="redIntent" class="muted">รอการวางแผน</span></div></div><div class="controls"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="step">⏭ Step</button><button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button><button id="restart">↻ Restart</button></div><div id="cards" class="cards"></div><section id="inspector" class="inspector"><div class="insHead"><div><b id="insActor">🤖 AI INSPECTOR</b><div id="insBrain" class="muted">เลือกตัวละคร</div></div><div><span id="insIntent" class="intent">—</span><div id="insConfidence" class="muted"></div></div></div><div class="tabs"><button data-tab="overview" class="on">Overview</button><button data-tab="candidates">Candidates</button><button data-tab="trace">Trace</button></div><div id="tab-overview"><div class="grid2"><div class="panel"><b>การตัดสินใจ</b><div id="insChosen">—</div><div id="insReason" class="muted">—</div></div><div class="panel"><b>สถานะ</b><div id="insState">—</div></div><div class="panel"><b>Team Context</b><div id="insTeam">—</div></div><div class="panel"><b>Performance</b><div id="insPerf">—</div></div></div></div><div id="tab-candidates" class="hidden"><div id="candidateList" class="panel">ยังไม่มีข้อมูล</div></div><div id="tab-trace" class="hidden"><div id="traceRaw" class="panel muted">ยังไม่มี DecisionSnapshot</div></div><div class="nav"><button id="prevDecision">◀ ก่อนหน้า</button><button id="latestDecision">ล่าสุด</button><button id="nextDecision">ถัดไป ▶</button></div></section><div id="log" class="log">พร้อมเริ่มการต่อสู้</div></div><script type="module" src="./auto-battle-live.js"></script></body></html>
