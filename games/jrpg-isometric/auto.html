<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TWA JRPG Auto Battle</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f0c;color:#f4ead8;font:14px system-ui,"Noto Sans Thai",sans-serif}.wrap{max-width:1120px;margin:auto;padding:8px}#view{height:min(64vh,620px);min-height:390px;border:1px solid #536657;border-radius:14px;overflow:hidden;background:#1b2720}canvas{width:100%!important;height:100%!important;display:block}.controls,.cards{display:grid;gap:7px;margin-top:8px}.controls{grid-template-columns:repeat(7,1fr)}.cards{grid-template-columns:repeat(4,1fr)}button,.card{border:1px solid #6c563d;border-radius:10px;background:#211710;color:#fff;padding:8px;min-height:44px}.card b{display:block}.bar{height:6px;background:#38271e;border-radius:99px;overflow:hidden;margin:4px 0}.hp{height:100%;background:#ca4b42}.muted{color:#b9aa94}.log{margin-top:8px;padding:8px;border:1px solid #514232;border-radius:10px;background:#15100d;min-height:54px}.on{outline:2px solid #e4bd63}@media(max-width:700px){.controls{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h2 style="margin:4px 0">⚔️ TWA JRPG — Auto Battle 2v2</h2><div class="muted">M1 · AI เคลื่อนที่ เลือกเป้าหมาย และเลือกสกิลเองทั้งหมด</div><div id="view"></div><div class="controls"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="step">⏭ Step</button><button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button><button id="restart">↻ Restart</button></div><div id="cards" class="cards"></div><div id="log" class="log">พร้อมเริ่มการต่อสู้</div></div><script type="module" src="./auto-battle-live.js"></script></body></html>
