<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TWA JRPG AI Inspector</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f0c;color:#f4ead8;font:14px system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:8px}#view{height:min(56vh,540px);min-height:340px;border:1px solid #536657;border-radius:14px;overflow:hidden;background:#1b2720}canvas{width:100%!important;height:100%!important}.controls,.cards,.teamBrain{display:grid;gap:6px;margin-top:8px}.controls{grid-template-columns:repeat(7,1fr)}.cards{grid-template-columns:repeat(4,1fr)}.teamBrain{grid-template-columns:1fr 1fr}button,.card,.panel,.brain,.inspector{border:1px solid #4e5c4f;border-radius:9px;background:#151a14;color:#fff;padding:7px}.card.selected,.on{outline:2px solid #e4bd63}.bar{height:5px;background:#38271e}.hp{height:100%;background:#ca4b42}.muted{color:#aeb9ae}.spatialControls,.tabs,.nav,.exportControls{display:flex;gap:5px;margin:7px 0;overflow-x:auto}.spatialControls button,.tabs button,.exportControls button{min-width:82px}.timelineWrap{margin-top:8px;border:1px solid #4e5c4f;border-radius:10px;background:#0f140f;padding:7px}.timeline{display:flex;gap:6px;overflow-x:auto;padding:7px 2px}.decisionDot{min-width:104px;text-align:left;background:#171d18}.decisionDot.active{outline:2px solid #e4bd63}.inspector{margin-top:8px}.insHead{display:flex;justify-content:space-between}.intentBig{font-weight:900;color:#f3ca70}.grid2,.roleGrid,.memoryGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.candidate,.memRow{border-bottom:1px solid #273129;padding:5px}.memRow{display:flex;justify-content:space-between;gap:8px}.memEvidence{font-size:11px;color:#8fa08f}.hidden{display:none}.log{margin-top:8px;padding:7px;background:#111712;border-radius:8px}@media(max-width:700px){.controls{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:1fr 1fr}.grid2,.roleGri
