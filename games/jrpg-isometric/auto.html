<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TWA JRPG Auto Battle</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f0c;color:#f4ead8;font:14px system-ui,"Noto Sans Thai",sans-serif}.wrap{max-width:1120px;margin:auto;padding:8px}#view{position:relative;height:min(64vh,620px);min-height:390px;border:1px solid #536657;border-radius:14px;overflow:hidden;background:#1b2720}canvas{width:100%!important;height:100%!important;display:block}.combatFx{position:absolute;inset:0;pointer-events:none;overflow:hidden}.damage{position:absolute;transform:translate(-50%,-50%);font-weight:1000;font-size:24px;color:#fff2c7;text-shadow:0 2px 2px #000,0 0 8px #a51d12;animation:damagePop .75s ease-out forwards}.damage.crit{font-size:32px;color:#ffd85d}.miss{color:#d9e9f5;text-shadow:0 2px 2px #000;font-size:20px}.skillName{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:18px;font-weight:900;padding:5px 12px;border-radius:999px;background:#15100ddd;border:1px solid #c29a52;animation:skillFlash .7s ease-out forwards}@keyframes damagePop{0%{opacity:0;transform:translate(-50%,-20%) scale(.55)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-150%) scale(.9)}}@keyframes skillFlash{0%{opacity:0;transform:translateX(-50%) scale(.8)}25%{opacity:1;transform:translateX(-50%) scale(1.05)}100%{opacity:0;transform:translateX(-50%) scale(1)}}.teamBrain{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.brain{border:1px solid #5b604d;border-radius:10px;background:#151a14;padding:8px}.brain b{display:block}.controls,.cards{display:grid;gap:7px;margin-top:8px}.controls{grid-template-columns:repeat(7,1fr)}.cards{grid-template-columns:repeat(4,1fr)}button,.card{border:1px solid #6c563d;border-radius:10px;background:#211710;color:#fff;padding:8px;min-height:44px}.card b{display:block}.bar{height:6px;background:#38271e;border-radius:99px;overflow:hidden;margin:4px 0}.hp{height:100%;background:#ca4b42}.muted{color:#b9aa94}.log{margin-top:8px;padding:8px;border:1px solid #514232;border-radius:10px;background:#15100d;min-height:54px}.on{outline:2px solid #e4bd63}@media(max-width:700px){.controls{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:1fr 1fr}.teamBrain{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h2 style="margin:4px 0">⚔️ TWA JRPG — Auto Battle 2v2</h2><div class="muted">M2 · Team Brain Live · AI วางแผนระดับทีมก่อนตัดสินใจรายตัว</div><div id="view"><div id="combatFx" class="combatFx"></div></div><div class="teamBrain"><div class="brain"><b>🔵 TEAM BLUE</b><span id="blueIntent" class="muted">รอการวางแผน</span></div><div class="brain"><b>🔴 TEAM RED</b><span id="redIntent" class="muted">รอการวางแผน</span></div></div><div class="controls"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="step">⏭ Step</button><button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button><button id="restart">↻ Restart</button></div><div id="cards" class="cards"></div><div id="log" class="log">พร้อมเริ่มการต่อสู้</div></div><script type="module" src="./auto-battle-live.js"></script></body></html>
