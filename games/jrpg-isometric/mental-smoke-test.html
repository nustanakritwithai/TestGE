<!doctype html><meta charset="utf-8"><title>Mental Integration Smoke Test</title><pre id="out">running…</pre><script type="module">import{attachMental,applyMentalToBattleStats,combatMentalEvent,settleActorMental,mentalDamageMultiplier,mentalSnapshot}from'./battle-v7.js';const out=document.getElementById('out'),actor={};attachMental(actor,{focus:70,morale:68,stress:20,confidence:64});const base={accuracy:.8,reaction:70,move:4,guardEff:.65};const mod=applyMentalToBattleStats(base,actor);const before=mentalSnapshot(actor);combatMentalEvent(actor,'HIT');const afterHit=mentalSnapshot(actor);combatMentalEvent(actor,'HEAVY_HIT');settleActorMental(actor);const afterTurn=mentalSnapshot(actor);const checks=[['mental attached',before.focus===70],['accuracy modified',mod.accuracy>base.accuracy],['reaction modified',mod.reaction>base.reaction],['damage multiplier finite',Number.isFinite(mentalDamageMultiplier(actor))],['HIT raises confidence',afterHit.confidence>before.confidence],['turn state bounded',Object.values(afterTurn).filter(v=>typeof v==='number').every(v=>Number.isFinite(v))]];const pass=checks.every(([,v])=>v);out.textContent=(pass?'PASS':'FAIL')+'\n'+checks.map(([n,v])=>`${v?'✓':'✗'} ${n}`).join('\n')+'\n\n'+JSON.stringify({before,afterHit,afterTurn},null,2);document.title=(pass?'PASS ':'FAIL ')+document.title;</script>
