<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TWA JRPG 2v2 Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#0c100d;color:#f4ead8;font:14px system-ui,"Noto Sans Thai",sans-serif}.wrap{max-width:1100px;margin:auto;padding:8px}#view{height:min(68vh,650px);min-height:390px;border:1px solid #536657;border-radius:14px;overflow:hidden;background:#1b2720}canvas{width:100%!important;height:100%!important;display:block;touch-action:none}.panel{margin-top:8px;padding:9px;border:1px solid #5d4b38;border-radius:12px;background:#19130f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.team{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{min-height:46px;border-radius:10px;border:1px solid #806445;background:#392719;color:white;font-weight:800}button.sel{outline:2px solid #e7c36e}.muted{color:#b8aa94}.bar{height:6px;background:#33241c;border-radius:99px;overflow:hidden}.hp{height:100%;background:#c94a42}@media(max-width:650px){.grid{grid-template-columns:1fr}.team{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h2 style="margin:4px 0">⚔️ TWA JRPG — 2v2 Live Preview</h2><div class="muted">แตะตัวละครฝ่ายเรา → แตะพื้นเพื่อเคลื่อนที่ · แตะศัตรูเพื่อเลือกเป้าหมาย · Attack เพื่อทดสอบรอบ</div><div id="view"></div><div class="grid"><div class="panel"><b>Party</b><div id="party" class="team"></div></div><div class="panel"><b>Target</b><div id="targets" class="team"></div></div></div><div class="panel"><button id="attack" style="width:100%">โจมตีเป้าหมาย</button><div id="status" class="muted" style="margin-top:7px"></div></div></div><script type="module" src="./battle-2v2-preview.js"></script></body></html>
