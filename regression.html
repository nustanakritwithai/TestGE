<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TestGE TWA V1 Regression</title><style>body{margin:0;background:#07111f;color:#eef7ff;font:14px/1.5 system-ui,"Noto Sans Thai",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.panel{background:#0d1b2d;border:1px solid #294863;border-radius:14px;padding:14px;margin-bottom:12px}button{background:#123e5a;color:#fff;border:1px solid #416886;border-radius:9px;padding:10px 14px}.ok{color:#5ce2a2}.bad{color:#ff6b6b}.row{display:grid;grid-template-columns:1.2fr .3fr 1.5fr;gap:10px;padding:8px;border-bottom:1px solid #19344a}.muted{color:#91a9c1}a{color:#48c9ff}</style></head><body><div class="wrap"><h1>TestGE TWA V1 — Regression Suite</h1><p class="muted">ทดสอบ Determinism, Rollback/Replay, Lifecycle, Delta Replication, Parallel Equivalence และ Public API</p><div class="panel"><button id="run">รันทดสอบทั้งหมด</button> <a href="./">กลับหน้าหลัก</a> <a href="./v1-demo.html">เปิด TWA V1 Demo</a><h2 id="summary">ยังไม่ได้รัน</h2><div id="rows"></div></div></div><script type="module">import{runRegressionSuite}from'./src/regression-suite.js';const run=document.getElementById('run'),rows=document.getElementById('rows'),summary=document.getElementById('summary');run.onclick=async()=>{run.disabled=true;summary.textContent='กำลังทดสอบ...';rows.innerHTML='';try{const r=await runRegressionSuite();summary.textContent=`${r.ok?'PASS':'FAIL'} • ${r.passed}/${r.total}`;summary.className=r.ok?'ok':'bad';rows.innerHTML=r.rows.map(x=>`<div class="row"><b>${x.name}</b><b class="${x.ok?'ok':'bad'}">${x.ok?'PASS':'FAIL'}</b><span class="muted">${x.detail}</span></div>`).join('')}catch(e){summary.textContent='ERROR '+e.message;summary.className='bad'}finally{run.disabled=false}};</script></body></html>
