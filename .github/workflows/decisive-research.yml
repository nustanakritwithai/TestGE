name: TestGE Decisive Research
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'research/**'
      - '.github/workflows/decisive-research.yml'
  workflow_dispatch:
jobs:
  decisive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run decisive benchmark
        run: node research/decisive.mjs
